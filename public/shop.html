<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17110d" />
  <title>Ember &amp; Oak Coffee — AI concierge</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .shop { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 430px); gap: 18px; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 18px max(18px, env(safe-area-inset-left, 0px)); height: calc(100vh - 58px); }
    .left { display: flex; flex-direction: column; gap: 18px; min-height: 0; min-width: 0; }
    .intro h1 { font-family: var(--f-serif); font-weight: 400; font-size: clamp(26px, 3vw, 38px); line-height: 1.12; margin: 6px 0 8px; text-wrap: balance; max-width: 22em; }
    .intro p { margin: 0; color: var(--steam); max-width: 40em; }

    /* the menu board, tilted slightly in 3D toward the pointer */
    .board-stage { flex: 1; min-height: 0; perspective: 1600px; }
    .board { height: 100%; overflow-y: auto; padding: 26px 32px 30px; border-radius: var(--r-lg); background: radial-gradient(120% 90% at 20% 0%, #2c2119, #1d1511 70%); border: 1px solid var(--line); box-shadow: inset 0 0 0 6px #140e0b, inset 0 0 0 7px var(--line-2), 0 30px 60px -30px rgba(0,0,0,.8); transform-style: preserve-3d; transition: transform .5s var(--ease); }
    .board h2 { font-family: var(--f-serif); font-weight: 400; font-size: 24px; color: var(--crema); margin: 0 0 10px; }
    .board section + section { margin-top: 26px; }
    .item { display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit; padding: 9px 10px; margin: 0 -10px; border-radius: var(--r-sm); cursor: pointer; transition: background .15s, transform .25s var(--ease); transform-style: preserve-3d; }
    .item:hover { background: rgba(240, 166, 74, .07); transform: translateZ(24px); }
    .item .line { display: flex; align-items: baseline; gap: 10px; font-size: 16.5px; }
    .item .name { font-weight: 600; }
    .item .leader { flex: 1; border-bottom: 2px dotted var(--line-2); transform: translateY(-4px); min-width: 20px; }
    .item:hover .leader { border-color: var(--crema); }
    .item .price { font-family: var(--f-serif); font-size: 18px; font-variant-numeric: tabular-nums; }
    .item .notes { font-size: 13.5px; color: var(--dust); margin-top: 1px; }
    .item .bag { display: none; font-size: 12.5px; font-weight: 600; color: var(--ok); margin-left: 8px; }
    .item.incart .bag { display: inline; }
    .item.incart .name::before { content: "✓ "; color: var(--ok); }
    .item.added { animation: added .7s var(--ease); }
    @keyframes added { 30% { background: rgba(143, 212, 164, .16); transform: translateZ(30px); } }

    .cart { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 14px; background: var(--paper); color: var(--paper-ink); font-family: var(--f-tape); }
    .cart b { font-family: var(--f-tape); }
    .cart-row { display: flex; justify-content: space-between; gap: 10px; padding: 1px 0; }
    .cart .tot { font-weight: 700; border-top: 1.5px dashed rgba(43,32,24,.45); margin-top: 6px; padding-top: 6px; }
    #pp-buttons { padding: 10px 16px; }
    #pp-buttons:empty { display: none; }
    .mockpay { width: 100%; background: #ffc439; border: 0; border-radius: 22px; padding: 12px; font-weight: 700; color: #003087; }
    @media (max-width: 960px) {
      .shop { grid-template-columns: minmax(0, 1fr); height: auto; }
      .board-stage { perspective: none; }
      .board { height: auto; overflow: visible; padding: 22px 20px; }
      .chat-panel { height: 75vh; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/">Ember &amp; Oak <small class="hide-sm">Specialty coffee roasters</small></a>
    <span id="mode" class="badge">PayPal sandbox</span>
    <div class="spacer"></div>
    <a class="btn" href="/console" target="_blank">Merchant console</a>
  </header>
  <main class="shop">
    <section class="left">
      <div class="intro">
        <h1>Tell the concierge what you like. It builds the bag and checks out with PayPal.</h1>
        <p>Pick something from the board to ask about it, or describe who you're buying for and your budget.</p>
      </div>
      <div class="board-stage" id="boardStage"><div class="board" id="products"></div></div>
    </section>
    <section class="panel chat-panel">
      <div class="panel-h"><span class="orb" id="orb"></span> Coffee concierge <span class="sub" id="aiLabel">AI with PayPal checkout</span></div>
      <div class="chat" id="chat"></div>
      <div class="suggest" id="suggest"></div>
      <div class="cart" id="cart" hidden></div>
      <div id="pp-buttons"></div>
      <form class="composer" id="form">
        <textarea id="input" rows="1" placeholder="A gift for my dad who loves dark coffee, under $60"></textarea>
        <button class="btn primary" style="height:42px">Send</button>
      </form>
    </section>
  </main>
  <div class="toasts" id="toasts"></div>
  <script type="module">
    import { createChat, sessionId } from "/chat.js";
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const config = await fetch("/api/config").then((r) => r.json());
    if (config.mock) { $("mode").textContent = "Mock mode"; $("mode").classList.add("mock"); }
    const sid = sessionId("tally-shop");
    $("aiLabel").textContent = `${config.ai.provider === "gemini" ? "Gemini" : "Claude"} with PayPal checkout`;
    let cartSkus = new Set();

    // Group the catalog the way a café menu board would.
    const section = (p) => p.tags.some((t) => ["gear", "mug", "filters", "kit", "grinder"].includes(t)) ? "Brewing gear"
      : p.tags.some((t) => ["subscription", "sampler"].includes(t)) ? "Gifts and subscriptions" : "Coffee";
    const ORDER = ["Coffee", "Brewing gear", "Gifts and subscriptions"];
    const renderProducts = (justAdded) => {
      $("products").innerHTML = ORDER.map((sec) => `<section><h2>${sec}</h2>${config.catalog.filter((p) => section(p) === sec).map((p) => `
        <button class="item ${cartSkus.has(p.sku) ? "incart" : ""} ${p.sku === justAdded ? "added" : ""}" type="button" data-sku="${p.sku}">
          <span class="line"><span class="name">${esc(p.name)}</span><span class="bag">in your bag</span><span class="leader"></span><span class="price">${p.price.toFixed(2)}</span></span>
          <span class="notes">${p.tags.slice(0, 3).map(esc).join(", ")}</span>
        </button>`).join("")}</section>`).join("");
    };
    renderProducts();
    $("products").onclick = (e) => {
      const c = e.target.closest("[data-sku]"); if (!c) return;
      const p = config.catalog.find((x) => x.sku === c.dataset.sku);
      send(cartSkus.has(p.sku) ? `Remove the ${p.name} from my bag` : `Tell me about the ${p.name}. Who is it good for?`);
    };

    // Board leans gently toward the pointer.
    const stage = $("boardStage"), board = $("products");
    if (!reduced) {
      stage.addEventListener("pointermove", (e) => {
        if (innerWidth < 960) return;
        const r = stage.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
        board.style.transform = `rotateX(${(-y * 4).toFixed(2)}deg) rotateY(${(x * 5).toFixed(2)}deg)`;
      });
      stage.addEventListener("pointerleave", () => { board.style.transform = ""; });
    }

    const chat = createChat({ el: $("chat"), endpoint: "/api/shop/chat", sessionId: sid, onEvent, onBusy: (b) => $("orb").classList.toggle("busy", b) });
    chat.add("msg agent", "<p>Hi! What are you brewing, or who are you shopping for? Give me a budget and I'll put the bag together.</p>");
    for (const s of ["A gift for a pour-over nerd under $50", "I drink espresso every day at the office", "Something for cold brew season", "Check out"]) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => send(s); $("suggest").appendChild(b);
    }

    function send(text) { if (chat.isBusy()) return; $("suggest").style.display = "none"; chat.send(text); }
    $("form").onsubmit = (e) => { e.preventDefault(); const t = $("input").value.trim(); if (t) { send(t); $("input").value = ""; } };
    $("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });

    function renderCart(cart) {
      const added = cart.items.find((i) => !cartSkus.has(i.sku));
      cartSkus = new Set(cart.items.map((i) => i.sku));
      renderProducts(added?.sku);
      $("cart").hidden = !cart.items.length;
      $("cart").innerHTML = "<b>Your bag</b>" + cart.items.map((i) => `<div class="cart-row"><span>${i.quantity}× ${esc(i.name)}</span><span>${i.line_total.toFixed(2)}</span></div>`).join("") +
        `<div class="cart-row tot"><span>TOTAL USD</span><span>${cart.total.toFixed(2)}</span></div>`;
    }

    function onEvent(ev) {
      if (ev.type === "cart") { renderCart(ev.cart); $("pp-buttons").innerHTML = ""; }
      if (ev.type === "checkout") showCheckout(ev);
    }

    async function captured(orderId) {
      const r = await fetch("/api/shop/capture", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ orderId, sessionId: sid }) }).then((r) => r.json());
      $("pp-buttons").innerHTML = "";
      if (r.error) return chat.add("msg err", esc(r.error));
      renderCart({ items: [], total: 0 });
      chat.add("msg notice", `Paid with PayPal. Order ${esc(orderId)}${r.capture_id ? `, capture ${esc(r.capture_id)}` : ""}. Thank you!`);
    }

    let sdkLoaded;
    function loadSdk() {
      sdkLoaded ||= new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(config.clientId)}&currency=USD&intent=capture&components=buttons`;
        s.onload = res; s.onerror = rej; document.head.appendChild(s);
      });
      return sdkLoaded;
    }

    async function showCheckout({ orderId, total }) {
      $("pp-buttons").innerHTML = "";
      if (config.mock) {
        const b = document.createElement("button");
        b.className = "mockpay"; b.textContent = `Pay $${total.toFixed(2)} with PayPal (mock)`;
        b.onclick = () => captured(orderId);
        $("pp-buttons").appendChild(b);
        return;
      }
      await loadSdk();
      window.paypal.Buttons({
        style: { layout: "horizontal", tagline: false, height: 44, color: "gold", shape: "pill" },
        createOrder: () => orderId, // order created server-side by the AI agent
        onApprove: (data) => captured(data.orderID),
        onError: (err) => chat.add("msg err", "PayPal error: " + esc(err)),
      }).render("#pp-buttons");
    }
  </script>
</body>
</html>
